# Tool configuration for agent-trace.
#
# Deliberately has no `[project]`/`[build-system]`: the CLI is not installed by
# pip. `bash install.sh cli` symlinks cli/agenttrace.py into ~/.local/bin, and
# the adapters are installed by their own hosts (plugin copy, hooks.json, pi
# install). Claiming a PEP 621 build here would advertise a `pip install .` that
# does not work — the layout is scripts + plugins, not a package.
#
# What this file IS for: one place to configure the linter and the type checker
# so CI and a developer's editor agree.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/F/W catch real defects (undefined names, unused/undefined imports, bad
# excepts); B catches the bugbear class that has actually bitten this code
# (mutable defaults, zip strictness, unused loop variables).
select = ["E", "F", "W", "B"]
ignore = [
    # Prose comments here routinely run past 100 columns: the long ones are the
    # load-bearing ones (they record why a fix exists), and wrapping them makes
    # them harder to read, not easier. Code lines are wrapped by hand.
    "E501",
    # Single-letter `l`/`I` appears only in ANSI/CSI regexes, where it mirrors
    # the terminal's own naming; renaming buys nothing and costs readability.
    "E741",
]

[tool.mypy]
python_version = "3.10"
files = ["common", "cli", "codex", "hermes"]
# Untyped defs are still *checked* where an annotation exists, but missing
# annotations are not errors yet: the adapters predate typing and rewriting
# 2k lines to satisfy strict mode would be churn, not safety.
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
show_error_codes = true

# The shared module is new and is held to the full standard — it is the one
# place a mistake affects every adapter at once.
[[tool.mypy.overrides]]
module = "agenttrace_common"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

# Hermes loads in test harnesses that stub the `agent.*` runtime modules, and
# the Pi extension is `any`-typed against an undocumented ExtensionAPI surface.
[[tool.mypy.overrides]]
module = ["agent.*", "agent_trace_hermes"]
ignore_missing_imports = true
